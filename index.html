  <script type="text/babel" data-presets="react">
// sections-misc.jsx — Прайс, Долги, Ссылки

const { useState: miscState, useEffect: miscEffect } = React;

// ──────── Prices ────────
// Hue map for category-related hover images (per price key prefix)
const PRICE_HUE = {
  Portrait: 320, 'Half body': 280, 'Full body': 220, Chibi: 40, Smiles: 50,
  Icons: 30, Panels: 10, Allert: 10, 'Chibi PNG': 60, 'Half body PNG': 200,
  'Full body PNG': 240, 'VTuber model': 320, 'Chibi model v.1': 35,
  'Chibi model v.2': 50, Background: 200, 'Reference sheet': 20,
};
function priceHue(key) {
  for (const k in PRICE_HUE) if (key.startsWith(k)) return PRICE_HUE[k];
  return 40;
}
function priceTag(key) {
  if (/PNG/i.test(key)) return 'PNG';
  if (/VTuber/i.test(key)) return 'Live2D';
  if (/Chibi/i.test(key)) return 'Chibi';
  if (/Reference/i.test(key)) return 'Ref';
  if (/Background/i.test(key)) return 'BG';
  if (/Live2D/i.test(key)) return 'Live2D';
  return 'Art';
}

function PricesSection({ t, lang, admin }) {
  const priceDefaults = React.useMemo(() => DEFAULT_PRICES.map((p, i) => ({ ...p, label: p.key, sort_order: i })), []);
  const pricesRes = useResource('prices', priceDefaults);
  const prices = pricesRes.items.map(p => ({ ...p, key: p.label || p.key }));

  function updatePrice(id, patch) {
    const dbPatch = { ...patch };
    if ('key' in dbPatch) { dbPatch.label = dbPatch.key; delete dbPatch.key; }
    pricesRes.update(id, dbPatch);
  }
  function deletePrice(id) {
    pricesRes.remove(id);
  }
  function addPrice() {
    pricesRes.add({ label: 'New item', rub: 1000 });
  }

  return (
    <section className="page anim-in">
      <PageHead
        eyebrow={`✦ ${t.prices.title} ✦`}
        title={t.prices.title}
        subtitle={t.prices.subtitle}
      />

      <div className="prices-grid stagger-children">
        {prices.map((p) => {
          const hue = priceHue(p.key);
          const tag = priceTag(p.key);
          // Inline SVG gradient as hover image (no asset needed; user will replace)
          const svg = encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
              <defs>
                <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="hsl(${hue}, 60%, 50%)"/>
                  <stop offset="100%" stop-color="hsl(${hue + 20}, 55%, 30%)"/>
                </linearGradient>
                <pattern id="p" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                  <line x1="0" y1="0" x2="0" y2="20" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
                </pattern>
              </defs>
              <rect width="600" height="200" fill="url(#g)"/>
              <rect width="600" height="200" fill="url(#p)"/>
              <text x="540" y="180" font-family="serif" font-style="italic" font-size="120" fill="rgba(255,255,255,0.18)" text-anchor="end">✦</text>
            </svg>`
          );
          const svgImg = `url("data:image/svg+xml;utf8,${svg}")`;
          const cardImg = p.image ? `url("${p.image}")` : svgImg;
          return (
            <div className="price-card" key={p.id} style={{ '--card-img': cardImg }}>
              <span className="price-card-tag">{tag}</span>
              <span className="price-card-name">
                <Editable value={p.key} onSave={(v) => updatePrice(p.id, { key: v })} admin={admin} />
              </span>
              <span className="price-card-val">
                <span className="from">{t.prices.from}</span>
                {admin ? (
                  <>
                    <EditableNumber value={p.rub} onSave={(v) => updatePrice(p.id, { rub: v })} admin={admin} />
                    <span style={{ marginLeft: 4 }}>₽</span>
                  </>
                ) : fmtMoney(p.rub, lang)}
              </span>
              {admin && (
                <button className="admin-btn danger" style={{ position: 'absolute', top: 8, left: 8 }} onClick={() => deletePrice(p.id)}>×</button>
              )}
              {admin && (
                <div style={{ position: 'absolute', bottom: 8, right: 8, display: 'flex', gap: 4, zIndex: 2 }}>
                  <ImageUploader label="📷 фото" onUpload={(url) => pricesRes.update(p.id, { image: url })} />
                  {p.image && <button className="upload-btn" onClick={() => pricesRes.update(p.id, { image: '' })}>✕</button>}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {admin && (
        <button className="add-btn" onClick={addPrice}>+ {lang === 'ru' ? 'Добавить позицию' : 'Add item'}</button>
      )}
    </section>
  );
}

// ──────── Debts ────────
function DebtsSection({ t, admin }) {
  const debtDefaults = React.useMemo(() => DEFAULT_DEBTS.map((d, i) => ({ ...d, stream_date: d.stream, sort_order: i })), []);
  const debtsRes = useResource('debts', debtDefaults);
  const debts = debtsRes.items.map(d => ({ ...d, stream: d.stream_date || d.stream }));

  function cycleStatus(id) {
    const d = debts.find(x => x.id === id);
    if (!d) return;
    const order = ['open', 'inProgress', 'done'];
    const next = order[(order.indexOf(d.status) + 1) % order.length];
    const progress = next === 'done' ? 100 : (next === 'open' ? 0 : (d.progress || 50));
    debtsRes.update(id, { status: next, progress });
  }
  function updateDebt(id, patch) {
    const dbPatch = { ...patch };
    if ('stream' in dbPatch) { dbPatch.stream_date = dbPatch.stream; delete dbPatch.stream; }
    debtsRes.update(id, dbPatch);
  }
  function deleteDebt(id) { debtsRes.remove(id); }
  const [debtModal, setDebtModal] = miscState(null); // null | {item, isNew}

  const debtFields = React.useMemo(() => [
    { key: 'title', label: t.debts.title === 'Долги' ? 'Название' : 'Title', type: 'text', required: true, default: '' },
    { key: 'stream_date', label: t.debts.title === 'Долги' ? 'Дата стрима' : 'Stream date', type: 'date', default: new Date().toISOString().slice(0, 10) },
    { key: 'reason', label: t.debts.title === 'Долги' ? 'Причина' : 'Reason', type: 'text', default: '' },
    { key: 'status', label: t.debts.title === 'Долги' ? 'Статус' : 'Status', type: 'select', default: 'open', options: [
      { value: 'open', label: t.debts.status.open },
      { value: 'inProgress', label: t.debts.status.inProgress },
      { value: 'done', label: t.debts.status.done },
    ]},
    { key: 'progress', label: t.debts.title === 'Долги' ? 'Прогресс (%)' : 'Progress (%)', type: 'number', min: 0, max: 100, default: 0 },
  ], [t]);

  function addDebt() {
    setDebtModal({ item: null, isNew: true });
  }
  function editDebt(item) {
    setDebtModal({ item: { ...item, stream_date: item.stream_date || item.stream }, isNew: false });
  }
  function handleSaveDebt(draft) {
    if (debtModal.isNew) {
      debtsRes.add({
        title: draft.title,
        stream_date: draft.stream_date,
        reason: draft.reason,
        status: draft.status || 'open',
        progress: draft.status === 'done' ? 100 : (draft.progress || 0),
      });
    } else {
      const patch = { ...draft };
      if ('stream' in patch) { patch.stream_date = patch.stream; delete patch.stream; }
      debtsRes.update(debtModal.item.id, patch);
    }
  }

  const sorted = [...debts].sort((a, b) => {
    const order = { open: 0, inProgress: 1, done: 2 };
    return (order[a.status] - order[b.status]) || (b.stream || '').localeCompare(a.stream || '');
  });

  return (
    <section className="page anim-in">
      <PageHead
        eyebrow={`✦ ${t.debts.title} ✦`}
        title={t.debts.title}
        subtitle={t.debts.subtitle}
      />

      {sorted.length === 0 ? (
        <div className="empty">{t.debts.empty}</div>
      ) : (
        <div className="debt-list">
          {sorted.map((d) => {
            const pct = d.progress ?? (d.status === 'done' ? 100 : d.status === 'inProgress' ? 50 : 0);
            return (
              <div key={d.id} className={`debt-row ${d.status}`}>
                <div className="debt-icon">
                  {d.status === 'done' ? '✓' : d.status === 'inProgress' ? '◐' : '○'}
                </div>
                <div className="debt-info">
                  <span className="debt-title">
                    <Editable value={d.title} onSave={(v) => updateDebt(d.id, { title: v })} admin={admin} />
                  </span>
                  <span className="debt-meta">
                    {t.debts.streamFrom} {d.stream} · {t.debts.reason}: {d.reason}
                  </span>
                  <div className="debt-bar">
                    <span style={{ width: `${pct}%` }}></span>
                  </div>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6 }}>
                  <span className="debt-pct">
                    <EditableNumber value={pct} onSave={(v) => updateDebt(d.id, { progress: Math.max(0, Math.min(100, v)) })} admin={admin} suffix="%" />
                  </span>
                  <span className="debt-status" onClick={() => admin && cycleStatus(d.id)} style={{ cursor: admin ? 'pointer' : 'default' }}>
                    {t.debts.status[d.status]}
                  </span>
                </div>
                {admin && (
                  <div className="admin-actions" style={{ position: 'absolute', top: 8, right: 8, display: 'flex', gap: 4 }}>
                    <button className="admin-btn" onClick={() => editDebt(d)} title="Edit">✎</button>
                    <button className="admin-btn danger" onClick={() => deleteDebt(d.id)}>×</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {admin && (
        <button className="add-btn" onClick={addDebt}>+ {t.debts.title === 'Долги' ? 'Добавить долг' : 'Add debt'}</button>
      )}

      {admin && (
        <EditItemModal
          open={!!debtModal}
          onClose={() => setDebtModal(null)}
          onSave={handleSaveDebt}
          fields={debtFields}
          values={debtModal?.item}
          title={debtModal?.isNew ? (t.debts.title === 'Долги' ? 'Новый долг' : 'New debt') : (t.debts.title === 'Долги' ? 'Редактировать' : 'Edit')}
          lang={t.debts.title === 'Долги' ? 'ru' : 'en'}
        />
      )}
    </section>
  );
}

// ──────── Links ────────
const LINK_ICONS = {
  Twitch:    { glyph: 'T', bg: 'linear-gradient(135deg, #9146FF, #6629c9)' },
  YouTube:   { glyph: 'Y', bg: 'linear-gradient(135deg, #ff4d4d, #c1272d)' },
  'Twitter / X': { glyph: 'X', bg: 'linear-gradient(135deg, #1c1c1c, #444)' },
  Bluesky:   { glyph: 'B', bg: 'linear-gradient(135deg, #5dade2, #2980b9)' },
  Instagram: { glyph: 'I', bg: 'linear-gradient(135deg, #f58529, #dd2a7b, #8134af)' },
  Telegram:  { glyph: 'T', bg: 'linear-gradient(135deg, #29b6f6, #0277bd)' },
  Discord:   { glyph: 'D', bg: 'linear-gradient(135deg, #5865F2, #3b45c5)' },
  Boosty:    { glyph: 'B', bg: 'linear-gradient(135deg, #ff7e2e, #d95a14)' },
  'Ko-fi':   { glyph: 'K', bg: 'linear-gradient(135deg, #ff5e5b, #c5403f)' },
  Email:     { glyph: '@', bg: 'linear-gradient(135deg, var(--accent), var(--accent-deep))' },
};

function LinksSection({ t, admin }) {
  const linkDefaults = React.useMemo(() => DEFAULT_LINKS.map((l, i) => ({ ...l, sort_order: i })), []);
  const linksRes = useResource('links', linkDefaults);
  const links = linksRes.items;

  function updateLink(id, patch) { linksRes.update(id, patch); }
  function deleteLink(id) { linksRes.remove(id); }
  const [linkModal, setLinkModal] = miscState(null);

  const linkFields = React.useMemo(() => [
    { key: 'label', label: t.links.title === 'Ссылки' ? 'Название' : 'Label', type: 'text', required: true, default: '' },
    { key: 'handle', label: 'Handle / @', type: 'text', default: '' },
    { key: 'url', label: 'URL', type: 'text', required: true, default: 'https://', placeholder: 'https://...' },
    { key: 'kind', label: t.links.title === 'Ссылки' ? 'Тип' : 'Kind', type: 'select', default: 'social', options: [
      { value: 'social', label: 'Social' },
      { value: 'stream', label: 'Stream' },
      { value: 'video', label: 'Video' },
      { value: 'chat', label: 'Chat' },
      { value: 'support', label: 'Support' },
      { value: 'mail', label: 'Email' },
    ]},
  ], [t]);

  function addLink() {
    setLinkModal({ item: null, isNew: true });
  }
  function editLink(item) {
    setLinkModal({ item, isNew: false });
  }
  function handleSaveLink(draft) {
    if (linkModal.isNew) {
      linksRes.add({ label: draft.label, handle: draft.handle, url: draft.url, kind: draft.kind || 'social' });
    } else {
      linksRes.update(linkModal.item.id, draft);
    }
  }

  return (
    <section className="page">
      <PageHead
        eyebrow={`✦ ${t.links.title} ✦`}
        title={t.links.title}
        subtitle={t.links.subtitle}
      />

      <div className="links-grid">
        {links.map((l) => {
          const icon = LINK_ICONS[l.label] || { glyph: l.label[0], bg: 'linear-gradient(135deg, var(--accent), var(--accent-deep))' };
          return (
            <a key={l.id} href={l.url} target="_blank" rel="noopener noreferrer" className="link-card"
               onClick={(e) => admin && e.preventDefault()}>
              <div className="link-icon" style={{ background: icon.bg }}>{icon.glyph}</div>
              <div className="link-info">
                <span className="link-label">
                  <Editable value={l.label} onSave={(v) => updateLink(l.id, { label: v })} admin={admin} />
                </span>
                <span className="link-handle">
                  <Editable value={l.handle} onSave={(v) => updateLink(l.id, { handle: v })} admin={admin} />
                </span>
              </div>
              {admin && (
                <div style={{ display: 'flex', gap: 4 }}>
                  <button className="admin-btn" onClick={(e) => { e.preventDefault(); editLink(l); }} title="Edit">✎</button>
                  <button className="admin-btn danger" onClick={(e) => { e.preventDefault(); deleteLink(l.id); }}>×</button>
                </div>
              )}
            </a>
          );
        })}
      </div>

      {admin && (
        <button className="add-btn" onClick={addLink}>+ {t.links.title === 'Ссылки' ? 'Добавить ссылку' : 'Add link'}</button>
      )}

      {admin && (
        <EditItemModal
          open={!!linkModal}
          onClose={() => setLinkModal(null)}
          onSave={handleSaveLink}
          fields={linkFields}
          values={linkModal?.item}
          title={linkModal?.isNew ? (t.links.title === 'Ссылки' ? 'Новая ссылка' : 'New link') : (t.links.title === 'Ссылки' ? 'Редактировать' : 'Edit')}
          lang={t.links.title === 'Ссылки' ? 'ru' : 'en'}
        />
      )}
    </section>
  );
}

Object.assign(window, { PricesSection, DebtsSection, LinksSection });

  </script>

  <script type="text/babel" data-presets="react">
// app.jsx — Главное приложение milaria (с Supabase auth)

const { useState: appState, useEffect: appEffect } = React;

const FONT_PAIRS = {
  cormorant: { display: "'Cormorant Garamond', Georgia, serif",   body: "'IBM Plex Sans', system-ui, sans-serif",  label: "Cormorant + Plex" },
  garamond:  { display: "'EB Garamond', Georgia, serif",          body: "'IBM Plex Sans', system-ui, sans-serif",  label: "Garamond + Plex" },
  playfair:  { display: "'Playfair Display', Georgia, serif",     body: "'DM Sans', system-ui, sans-serif",        label: "Playfair + DM" },
  instrument:{ display: "'Instrument Serif', Georgia, serif",     body: "'Manrope', system-ui, sans-serif",        label: "Instrument + Manrope" },
  unbounded: { display: "'Unbounded', system-ui, sans-serif",     body: "'Inter Tight', system-ui, sans-serif",    label: "Unbounded + Tight" },
};

const ACCENT_PALETTES = {
  amber:   { accent: "#e8a93b", deep: "#b8741f", soft: "#f5d4a3" },
  sunset:  { accent: "#e88a3a", deep: "#a85518", soft: "#f5c6a3" },
  peach:   { accent: "#e8b89c", deep: "#b87a5a", soft: "#f5e0d2" },
  pink:    { accent: "#ec6aa7", deep: "#9a3d68", soft: "#ffd1e6" },
  rose:    { accent: "#d97585", deep: "#9a4654", soft: "#f0c8cf" },
  honey:   { accent: "#d4b94a", deep: "#9a832a", soft: "#f0e3a0" },
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "fontPair": "cormorant",
  "accent": "amber",
  "radius": 14,
  "barStyle": "classic",
  "layout": "list"
}/*EDITMODE-END*/;

async function connection_check() {
  if (!window.__supabase) return { ok: false, msg: 'SDK не загружен' };
  try {
    const t0 = Date.now();
    const { data, error } = await window.__supabase.from('queue_items').select('id').limit(1);
    const ms = Date.now() - t0;
    if (error) return { ok: false, msg: 'DB error: ' + error.message };
    // Try a write to test RLS
    const { data: { user } } = await window.__supabase.auth.getUser();
    if (!user) return { ok: 'read', msg: `Чтение OK (${ms}ms), но не залогинен — запись недоступна` };
    return { ok: true, msg: `Полный доступ OK (${ms}ms)` };
  } catch (e) {
    return { ok: false, msg: 'Network error: ' + (e?.message || 'unknown') };
  }
}

function App() {
  const [lang, setLang] = appState(() => loadLS('lang', 'ru'));
  const [tab, setTab] = appState(() => loadLS('tab', 'home'));
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const auth = useAuth();
  const [loginOpen, setLoginOpen] = appState(false);
  const admin = auth.isAdmin;

  appEffect(() => saveLS('lang', lang), [lang]);
  appEffect(() => saveLS('tab', tab), [tab]);

  appEffect(() => {
    const root = document.documentElement;
    const pair = FONT_PAIRS[t.fontPair] || FONT_PAIRS.cormorant;
    const pal = ACCENT_PALETTES[t.accent] || ACCENT_PALETTES.amber;
    root.style.setProperty('--font-display', pair.display);
    root.style.setProperty('--font-body', pair.body);
    root.style.setProperty('--accent', pal.accent);
    root.style.setProperty('--accent-deep', pal.deep);
    root.style.setProperty('--accent-soft', pal.soft);
    root.style.setProperty('--radius-card', t.radius + 'px');
  }, [t]);

  const i18n = I18N[lang];

  const tabs = [
    { id: 'home',       label: i18n.nav.home },
    { id: 'queue',      label: i18n.nav.queue },
    { id: 'portfolio',  label: i18n.nav.portfolio },
    { id: 'calculator', label: i18n.nav.calculator },
    { id: 'prices',     label: i18n.nav.prices },
    { id: 'debts',      label: i18n.nav.debts },
  ];

  let SectionEl = null;
  if (tab === 'home')       SectionEl = <HomeSection t={i18n} lang={lang} admin={admin} onGoTo={setTab} />;
  if (tab === 'queue')      SectionEl = <QueueSection t={i18n} lang={lang} admin={admin} layout={t.layout} barStyle={t.barStyle} />;
  if (tab === 'portfolio')  SectionEl = <PortfolioSection t={i18n} lang={lang} admin={admin} />;
  if (tab === 'calculator') SectionEl = <CalculatorSection t={i18n} lang={lang} admin={admin} />;
  if (tab === 'prices')     SectionEl = <PricesSection t={i18n} lang={lang} admin={admin} />;
  if (tab === 'debts')      SectionEl = <DebtsSection t={i18n} admin={admin} />;

  const isHome = tab === 'home';

  async function runSeed() {
    if (!confirm(lang === 'ru'
      ? 'Заполнить базу демо-данными? Это перепишет всё что сейчас в Supabase.'
      : 'Seed database with demo data? This will overwrite anything currently in Supabase.')) return;
    setSeeding(true);
    try {
      const report = await seedDefaults();
      const errors = report.filter(r => r.error);
      if (errors.length) {
        alert((lang === 'ru' ? 'Ошибки при загрузке: ' : 'Errors: ') + errors.map(e => `${e.table}: ${e.error}`).join('\n'));
      } else {
        alert(lang === 'ru' ? '✓ Готово! Обнови страницу.' : '✓ Done! Reload the page.');
        location.reload();
      }
    } catch (e) {
      alert('Error: ' + e.message);
    } finally {
      setSeeding(false);
    }
  }

  function handleAdminToggle() {
    if (admin) {
      // already logged in — offer logout
      if (confirm(lang === 'ru' ? 'Выйти из режима редактирования?' : 'Sign out of edit mode?')) {
        auth.signOut();
      }
    } else {
      setLoginOpen(true);
    }
  }

  return (
    <>
      <BackgroundLayer bgImage={null} />
      <div className="app">
        <TopNav
          tabs={tabs}
          active={tab}
          onChange={setTab}
          lang={lang}
          onLangToggle={() => setLang(lang === 'ru' ? 'en' : 'ru')}
          admin={admin}
          onAdminToggle={handleAdminToggle}
          t={i18n}
        />

        {admin && (
          <div className="admin-bar">
            <span>
              <span className="admin-pill">✦ {i18n.common.adminOn}</span>
              <span className="admin-bar-info">
                {auth.email} · {lang === 'ru' ? 'кликай по тексту/числам чтобы редактировать' : 'click text/numbers to edit'}
              </span>
            </span>
            <span className="admin-bar-actions">
              <button className="admin-btn" onClick={() => {
                if (confirm('Очистить локальный кеш и перезагрузить страницу? Это засинхронит с сервером.')) {
                  try {
                    Object.keys(localStorage).forEach(k => {
                      if (k.startsWith('milaria:cache:') || k.startsWith('milaria:setting:')) localStorage.removeItem(k);
                    });
                  } catch(e) {}
                  location.reload();
                }
              }} title="Синхронизировать с сервером" style={{ marginRight: 8 }}>⟳</button>
              <button className="admin-btn danger" onClick={() => auth.signOut()}>
                {lang === 'ru' ? 'выйти' : 'sign out'}
              </button>
            </span>
          </div>
        )}

        {isHome ?
          <main key={tab}>{SectionEl}<FootOrnament /></main> :
          <main className="shell" key={tab}>{SectionEl}<FootOrnament /></main>
        }
      </div>

      <LoginModal open={loginOpen} onClose={() => setLoginOpen(false)} auth={auth} lang={lang} />

      <TweaksPanel>
        <TweakSection label={lang === 'ru' ? 'Типографика' : 'Typography'} />
        <TweakSelect
          label={lang === 'ru' ? 'Пара шрифтов' : 'Font pair'}
          value={t.fontPair}
          options={Object.entries(FONT_PAIRS).map(([k, v]) => ({ value: k, label: v.label }))}
          onChange={(v) => setTweak('fontPair', v)}
        />

        <TweakSection label={lang === 'ru' ? 'Цвет' : 'Color'} />
        <TweakColor
          label={lang === 'ru' ? 'Акцент' : 'Accent'}
          value={ACCENT_PALETTES[t.accent]?.accent}
          options={Object.values(ACCENT_PALETTES).map(p => p.accent)}
          onChange={(v) => {
            const key = Object.keys(ACCENT_PALETTES).find(k => ACCENT_PALETTES[k].accent === v);
            if (key) setTweak('accent', key);
          }}
        />

        <TweakSection label={lang === 'ru' ? 'Форма' : 'Shape'} />
        <TweakSlider
          label={lang === 'ru' ? 'Скругление углов' : 'Corner radius'}
          value={t.radius}
          min={0} max={32} unit="px"
          onChange={(v) => setTweak('radius', v)}
        />

        <TweakSection label={lang === 'ru' ? 'Прогресс-бары' : 'Progress bars'} />
        <TweakRadio
          label={lang === 'ru' ? 'Стиль' : 'Style'}
          value={t.barStyle}
          options={['classic', 'striped', 'ticks', 'minimal']}
          onChange={(v) => setTweak('barStyle', v)}
        />

        <TweakSection label={lang === 'ru' ? 'Очередь' : 'Queue'} />
        <TweakRadio
          label={lang === 'ru' ? 'Layout' : 'Layout'}
          value={t.layout}
          options={['list', 'cards', 'timeline']}
          onChange={(v) => setTweak('layout', v)}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
