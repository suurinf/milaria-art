    if (window.__INITIAL_SETTINGS?.[key] !== undefined) return window.__INITIAL_SETTINGS[key];
    try {
      const cached = localStorage.getItem('milaria:setting:' + key);
      if (cached) return JSON.parse(cached);
    } catch(e) {}
    return defaultValue;
  });
  const [loaded, setLoaded] = React.useState(false);

  // Cache settings whenever they change
  React.useEffect(() => {
    try { localStorage.setItem('milaria:setting:' + key, JSON.stringify(value)); } catch(e) {}
  }, [key, value]);

  React.useEffect(() => {
    if (!_sbc) { setLoaded(true); return; }
    let mounted = true;

    _sbc.from('settings').select('value').eq('key', key).maybeSingle()
      .then(({ data, error }) => {
        if (!mounted) return;
        if (data && data.value) setValue(data.value);
        setLoaded(true);
      }).catch(() => setLoaded(true));

    let channel = null;
    try {
      channel = _sbc.channel(`rt:setting:${key}`)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'settings', filter: `key=eq.${key}` }, (payload) => {
          if (payload.new?.value) setValue(payload.new.value);
        })
        .subscribe();
    } catch(e) {}

    return () => { mounted = false; if (channel) try { _sbc.removeChannel(channel); } catch(e){} };
  }, [key]);

  async function save(newValue) {
    setValue(newValue); // optimistic
    if (!_sbc) return;
    try {
      await _sbc.from('settings').upsert({ key, value: newValue }, { onConflict: 'key' });
    } catch (e) { console.warn('[setting]', key, e?.message); }
  }

  return [value, save, loaded];
}

async function uploadImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        // Resize to max 1200px — high quality for portfolio
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        console.log('[upload] image:', w, 'x', h, '—', Math.round(dataUrl.length / 1024), 'KB');
        resolve(dataUrl);
      };
      img.onerror = function() { alert('Ошибка загрузки картинки'); resolve(null); };
      img.src = e.target.result;
    };
    reader.onerror = function() { alert('Ошибка чтения файла'); resolve(null); };
    reader.readAsDataURL(file);
  });
}

    ...DEFAULT_PORTFOLIO.illustrations.map((m, i) => ({ key: m.key, kind: "illustration", count: m.count, hue: m.hue, sort_order: i })),

function _withTimeout(promise, ms, label) {

// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).

  // useState-style call doesn't write a "[object Object]" key into the persisted

  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null

    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>

  );
}

function TweakText({ label, value, placeholder, onChange }) {

             onChange={(e) => onChange(e.target.value)} />

}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

// ──────────────── cover crop/position editor ────────────────
function CoverCropEditor({ src, position, onSave, onClose }) {
  // position = { x: 50, y: 50 } — focal point in %
  const [pos, setPos] = useState(position || { x: 50, y: 50 });
  const [dragging, setDragging] = useState(false);
  const containerRef = useRef(null);

  function updatePos(e) {
    const rect = containerRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const x = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
    const y = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));
    setPos({ x: Math.round(x), y: Math.round(y) });
  }

  function handleDown(e) { setDragging(true); updatePos(e); }
  function handleMove(e) { if (dragging) updatePos(e); }
  function handleUp() { setDragging(false); }

  return (
    <Modal open={true} onClose={onClose}>
      <div style={{ maxWidth: 500, minWidth: 300 }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--accent)', marginBottom: 8 }}>✦ обложка</div>

        }}
          onMouseDown={handleDown} onMouseMove={handleMove} onMouseUp={handleUp} onMouseLeave={handleUp}

        >

// ──────────────── media gallery (view, delete, set cover) ────────────────

// ──────────────── image uploader ────────────────
function ImageUploader({ onUpload, label, multiple }) {
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);

  async function handleFiles(e) {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    setBusy(true);
    const urls = [];
    for (const file of files) {
      const url = await window.uploadImage(file);
      if (url) urls.push(url);
    }
    setBusy(false);
    if (urls.length > 0) onUpload(multiple ? urls : urls[0]);
    if (inputRef.current) inputRef.current.value = '';
  }

  return (
    <button className="upload-btn" onClick={() => inputRef.current?.click()} disabled={busy}>
      <input ref={inputRef} type="file" accept="image/*" multiple={multiple}
        style={{ display: 'none' }} onChange={handleFiles} />
      {busy ? '⏳…' : (label || '📷')}
    </button>
  );
}

// ──────────────── universal edit/add modal ────────────────
function EditItemModal({ open, onClose, onSave, fields, values, title, lang }) {
  const [draft, setDraft] = useState({});

  useEffect(() => {
    if (open) {
      const init = {};
      fields.forEach(f => {
        init[f.key] = values ? (values[f.key] ?? f.default ?? '') : (f.default ?? '');
      });
      setDraft(init);
    }
  }, [open]);

  function handleSave() {
    onSave({ ...draft });
    onClose();
  }

  if (!open) return null;

  return (
    <Modal open={true} onClose={onClose}>
      <div style={{ maxWidth: 480, minWidth: 320 }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, letterSpacing: '0.04em', color: 'var(--accent)', marginBottom: 8 }}>
          ✦ {values ? (lang === 'ru' ? 'редактировать' : 'edit') : (lang === 'ru' ? 'добавить' : 'add')}
        </div>
        <h2 style={{ fontFamily: 'var(--font-display)', fontStyle: 'italic', fontSize: 32, margin: '0 0 20px', fontWeight: 500 }}>
          {title}
        </h2>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          {fields.map(f => (
            <label key={f.key} className="login-field">
              <span>{f.label}</span>
              {f.type === 'select' ? (
                <select
                  value={draft[f.key] || ''}
                  onChange={e => setDraft(prev => ({...prev, [f.key]: e.target.value}))}
                  style={{ padding: '10px 14px', borderRadius: 'var(--r)', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', color: 'var(--text)', fontFamily: 'var(--font-body)', fontSize: 14 }}>
                  {f.options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              ) : f.type === 'textarea' ? (
                <textarea
                  value={draft[f.key] || ''}
                  rows={3}
                  onChange={e => setDraft(prev => ({...prev, [f.key]: e.target.value}))}
                  style={{ padding: '10px 14px', borderRadius: 'var(--r)', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', color: 'var(--text)', fontFamily: 'var(--font-body)', fontSize: 14, resize: 'vertical' }}
                />
              ) : (
                <input
                  type={f.type || 'text'}
                  value={draft[f.key] ?? ''}
                  min={f.min}
                  max={f.max}
                  required={f.required}
                  placeholder={f.placeholder || ''}
                  onChange={e => {
                    const val = f.type === 'number' ? (parseInt(e.target.value) || 0) : e.target.value;
                    setDraft(prev => ({...prev, [f.key]: val}));
                  }}
                />
              )}
            </label>
          ))}
          <button className="btn btn-primary" onClick={handleSave} style={{ marginTop: 8, justifyContent: 'center' }}>
            {values
              ? (lang === 'ru' ? 'Сохранить' : 'Save')
              : (lang === 'ru' ? 'Добавить' : 'Add')}
          </button>
        </div>
      </div>
    </Modal>
  );
}

function RecentTile({ category, t, lang, onGoTo }) {
  // Each tile has multiple images that cycle on hover
  const imgCount = 4;
  const [idx, setIdx] = homeState(0);
  const [hovering, setHovering] = homeState(false);
  const intervalRef = homeRef(null);

  homeEffect(() => {
    if (hovering) {
      intervalRef.current = setInterval(() => {
        setIdx((i) => (i + 1) % imgCount);
      }, 2000);
    } else {
      clearInterval(intervalRef.current);
      setIdx(0);
    }
    return () => clearInterval(intervalRef.current);
  }, [hovering]);

  return (
    <div
      className="recent-tile"
      data-color={category.color}
      style={{ '--hue': category.hue }}
      onMouseEnter={() => setHovering(true)}
      onMouseLeave={() => setHovering(false)}
      onClick={() => onGoTo('portfolio')}>
      
      <div className="recent-tile-imgs">
        {Array.from({ length: imgCount }, (_, i) =>
        <div
          key={i}
          className={i === idx ? 'show' : ''}
          style={{ '--hue': category.hue + i * 12 }}>
        </div>
        )}
      </div>
      <div className="recent-tile-vlabel">{category.label}</div>
      <div className="recent-tile-counter">
        {Array.from({ length: imgCount }, (_, i) =>
        <span key={i} className={i === idx ? 'on' : ''}></span>
        )}
      </div>
      <div className="recent-tile-arrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </div>
    </div>);

}

function RecentWorks({ t, lang, onGoTo }) {

}

              {(bannerCfg.banner_status || 'open') === 'closed'

            </span>

            <p className="hero-sub">{t.home.bio}</p>
            <div className="hero-cta-row">
              <button className="btn btn-primary" onClick={() => onGoTo('calculator')}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="4" y="2" width="16" height="20" rx="2"></rect>
                  <line x1="8" y1="6" x2="16" y2="6"></line>
                  <line x1="8" y1="14" x2="8.01" y2="14"></line>
                  <line x1="12" y1="14" x2="12.01" y2="14"></line>

                {t.home.ctaCalc}
              </button>
              <button className="btn btn-ghost" onClick={() => onGoTo('portfolio')}>

  <script type="text/babel" data-presets="react">
// queue.jsx — Очередь заказов (в работе + выполнено)

const { useState: qState, useEffect: qEffect, useMemo: qMemo } = React;

// ───── one row (list layout) ─────
function QueueRow({ item, idx, t, admin, onUpdate, onDelete, onEdit, barStyle }) {
  return (
    <div className="q-row">
      <div className="q-row-fill" data-style={barStyle} style={{ '--p': `${item.progress}%` }}></div>
      {item.tag && <span className={`q-tag ${item.tag}`}>{t.queue[item.tag]}</span>}
      <div className="q-num">{idx + 1}</div>
      <div className="q-title">
        <Editable
          value={item.title}
          onSave={(v) => onUpdate({ ...item, title: v })}
          admin={admin}
        />
      </div>
      <div className="q-meta">
        <span className="q-progress-val">
          <EditableNumber
            value={item.progress}
            onSave={(v) => onUpdate({ ...item, progress: Math.max(0, Math.min(100, v)) })}
            admin={admin}
            suffix="%"
          />
        </span>
        <span className="q-progress-label">{t.queue.progress}</span>
      </div>
      {admin && (
        <div className="admin-actions" style={{ position: 'absolute', bottom: 4, right: 8 }}>
          <button className="admin-btn" onClick={() => onEdit && onEdit(item)} title="Edit">✎</button>
          <button className="admin-btn danger" onClick={() => onDelete(item.id)}>×</button>
        </div>
      )}
    </div>
  );
}

// ───── secret row (special) ─────
function SecretRow({ idx, t, admin, onDelete, itemId }) {
  return (
    <div className="q-row secret-row">
      <div className="q-row-fill" style={{ '--p': '100%', background: 'rgba(212, 168, 90, 0.06)' }}></div>
      <div className="q-num">{idx + 1}</div>
      <div className="q-title">— {t.queue.secret} —</div>
      <div className="q-meta">
        <span className="q-progress-val" style={{ color: 'var(--secret)' }}>?</span>
        <span className="q-progress-label">{t.queue.progress}</span>
      </div>
      {admin && (
        <div className="admin-actions" style={{ position: 'absolute', bottom: 4, right: 8 }}>
          <button className="admin-btn danger" onClick={() => onDelete(itemId)}>×</button>
        </div>
      )}
    </div>
  );
}

// ───── completed row (list) ─────
function DoneRow({ item, idx, t, admin, onDelete }) {
  if (item.tag === 'secret') return <SecretRow idx={idx} t={t} />;
  return (
    <div className="q-row done">
      <div className="q-row-fill"></div>
      {item.tag && <span className={`q-tag ${item.tag}`}>{t.queue[item.tag]}</span>}
      <div className="q-num">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block', margin: '0 auto' }}>
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div className="q-title">
        {item.title}
        <div className="q-date">{t.queue.done}: {item.date}</div>
      </div>
      <div className="q-meta">
        <span className="q-progress-val">100%</span>
        <span className="q-progress-label">{t.queue.ready}</span>
      </div>
      {admin && (
        <div className="admin-actions" style={{ position: 'absolute', bottom: 4, right: 8 }}>
          <button className="admin-btn danger" onClick={() => onDelete(item.id)}>×</button>
        </div>
      )}
    </div>
  );
}

// ───── card layout ─────
function QueueCard({ item, idx, t }) {
  return (
    <div className="q-card">
      {item.tag && <span className={`q-tag ${item.tag}`}>{t.queue[item.tag]}</span>}
      <div className="q-card-head">
        <span className="q-card-num">{String(idx + 1).padStart(2, '0')}</span>
      </div>
      <div className="q-card-title">{item.title}</div>
      <div className="q-card-bar">
        <span style={{ width: `${item.progress}%` }}></span>
      </div>
      <div className="q-card-foot">
        <span>{t.queue.progress}</span>
        <span style={{ color: 'var(--accent)' }}>{item.progress}%</span>
      </div>
    </div>
  );
}

// ───── timeline layout ─────
function QueueTimeItem({ item, idx, t, done }) {
  return (
    <div className={`q-time-item ${done ? 'done' : ''}`}>
      <div>
        <div className="q-time-num">№ {String(idx + 1).padStart(2, '0')}{item.date ? ` · ${item.date}` : ''}</div>
        <div className="q-time-title">{item.title}</div>
        {!done && (
          <div className="q-time-bar">
            <span style={{ width: `${item.progress}%` }}></span>
          </div>
        )}
      </div>
      <div className="q-time-pct">{done ? '✓' : `${item.progress}%`}</div>
    </div>
  );
}

// ───── main section ─────
function QueueSection({ t, lang, admin, layout, barStyle }) {
  // Defaults blend in-progress and completed into one array with `kind`
  const queueDefaults = React.useMemo(() => [
    ...DEFAULT_QUEUE_IN_PROGRESS.map((q, i) => ({ ...q, kind: 'in_progress', sort_order: i })),
    ...DEFAULT_QUEUE_COMPLETED.map((q, i) => ({ ...q, kind: 'completed', completed_date: q.date === '—' ? null : q.date, sort_order: 100 + i })),
  ], []);
  const queue = useResource('queue_items', queueDefaults);
  const inProgress = React.useMemo(() => queue.items.filter(x => x.kind === 'in_progress'), [queue.items]);
  const completed = React.useMemo(
    () => queue.items.filter(x => x.kind === 'completed').map(x => ({ ...x, date: x.completed_date || '—' })),
    [queue.items]
  );

  const [query, setQuery] = qState('');
  const [filter, setFilter] = qState('all');
  const [sort, setSort]   = qState('progress');

  // Animate progress on mount: start from 0
  const [animated, setAnimated] = qState(false);
  qEffect(() => {
    const id = requestAnimationFrame(() => setAnimated(true));
    return () => cancelAnimationFrame(id);
  }, []);

  const filteredInProgress = qMemo(() => {
    let arr = [...inProgress];
    if (query) arr = arr.filter(x => x.title.toLowerCase().includes(query.toLowerCase()));
    if (filter !== 'all') arr = arr.filter(x => x.tag === filter);
    if (sort === 'progress') arr.sort((a, b) => b.progress - a.progress);
    return arr;
  }, [inProgress, query, filter, sort]);

  const filteredCompleted = qMemo(() => {
    let arr = [...completed];
    if (query) arr = arr.filter(x => x.title.toLowerCase().includes(query.toLowerCase()));
    if (filter !== 'all') arr = arr.filter(x => x.tag === filter);
    if (sort === 'new') arr.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    else if (sort === 'old') arr.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    return arr;
  }, [completed, query, filter, sort]);

  function updateInProgress(updated) {
    queue.update(updated.id, { title: updated.title, progress: updated.progress, tag: updated.tag });
  }
  function deleteInProgress(id) {
    queue.remove(id);
  }
  const [editModal, setEditModal] = qState(null);

  const queueFields = qMemo(() => [
    { key: 'title', label: lang === 'ru' ? 'Название' : 'Title', type: 'text', required: true, default: '' },
    { key: 'progress', label: lang === 'ru' ? 'Прогресс (%)' : 'Progress (%)', type: 'number', min: 0, max: 100, default: 0 },
    { key: 'tag', label: lang === 'ru' ? 'Тип' : 'Type', type: 'select', default: '', options: [
      { value: '', label: lang === 'ru' ? '— нет —' : '— none —' },
      { value: 'paid', label: lang === 'ru' ? 'Оплачено' : 'Paid' },
      { value: 'free', label: lang === 'ru' ? 'Бесплатно' : 'Free' },
      { value: 'secret', label: lang === 'ru' ? 'Секрет' : 'Secret' },
    ]},
    { key: 'kind', label: lang === 'ru' ? 'Статус' : 'Status', type: 'select', default: 'in_progress', options: [
      { value: 'in_progress', label: lang === 'ru' ? 'В работе' : 'In progress' },
      { value: 'completed', label: lang === 'ru' ? 'Готово' : 'Completed' },
    ]},
  ], [lang]);

  function addInProgress() { setEditModal({ item: null, isNew: true }); }
  function editQueueItem(item) { setEditModal({ item, isNew: false }); }
  function handleSaveQueue(draft) {
    if (editModal.isNew) {
      queue.add({
        kind: draft.kind || 'in_progress',
        title: draft.title || 'New order',
        progress: draft.progress || 0,
        tag: draft.tag || null,
        completed_date: draft.kind === 'completed' ? new Date().toISOString().slice(0, 10) : null,
      });
    } else {
      queue.update(editModal.item.id, {
        title: draft.title, progress: draft.progress,
        tag: draft.tag || null, kind: draft.kind,
        completed_date: draft.kind === 'completed' ? new Date().toISOString().slice(0, 10) : null,
      });
    }
  }
  function deleteCompleted(id) {
    queue.remove(id);
  }

  // Pick layout
  function renderInProgress() {
    if (filteredInProgress.length === 0 && !admin) {
      return <div className="empty">{t.queue.empty}</div>;
    }
    if (layout === 'cards') {
      return (
        <div className="q-cards">
          {filteredInProgress.map((item, idx) => (
            <QueueCard key={item.id} item={animated ? item : { ...item, progress: 0 }} idx={idx} t={t} />
          ))}
        </div>
      );
    }
    if (layout === 'timeline') {
      return (
        <div className="q-timeline">
          {filteredInProgress.map((item, idx) => (
            <QueueTimeItem key={item.id} item={animated ? item : { ...item, progress: 0 }} idx={idx} t={t} />
          ))}
        </div>
      );
    }
    // list (default)
    return (
      <div className="q-list">
        {filteredInProgress.map((item, idx) => (
          <QueueRow
            key={item.id}
            item={animated ? item : { ...item, progress: 0 }}
            idx={idx}
            t={t}
            admin={admin}
            onUpdate={updateInProgress}
            onDelete={deleteInProgress}
            barStyle={barStyle}
          />
        ))}
      </div>
    );
  }

  return (
    <section className="page anim-in">
      <PageHead
        eyebrow={`✦ ${t.queue.title} ✦`}
        title={t.queue.title}
        subtitle={t.queue.subtitle}
      />

      <div className="toolbar">
        <div className="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            placeholder={t.queue.search}
            value={query}
            onChange={(e) => setQuery(e.target.value)}
          />
        </div>
        <div className="seg">
          {['all', 'paid', 'free'].map(f => (
            <button key={f} className={`seg-btn ${filter === f ? 'active' : ''}`} onClick={() => setFilter(f)}>
              {t.queue.filter[f]}
            </button>
          ))}
        </div>
        <div className="seg">
          {['progress', 'new', 'old'].map(s => (
            <button key={s} className={`seg-btn ${sort === s ? 'active' : ''}`} onClick={() => setSort(s)}>
              {t.queue.sort[s]}
            </button>
          ))}
        </div>
      </div>

      <div className="section-label">
        <span className="dot"></span>
        <span>{t.queue.inProgress}</span>
        <span style={{ color: 'var(--accent)' }}>{filteredInProgress.length}</span>
      </div>

      {renderInProgress()}

      {admin && (
        <button className="add-btn" onClick={addInProgress}>+ {t.queue.addNew}</button>
      )}

      {admin && editModal && (
        <EditItemModal
          open={true}
          onClose={() => setEditModal(null)}
          onSave={handleSaveQueue}
          fields={queueFields}
          values={editModal.item}
          title={editModal.isNew ? (lang === 'ru' ? 'Новый заказ' : 'New order') : (lang === 'ru' ? 'Редактировать' : 'Edit')}
          lang={lang}
        />
      )}

      <div className="section-label done" style={{ marginTop: 56 }}>
        <span className="dot"></span>
        <span>{t.queue.completed}</span>
        <span style={{ color: 'var(--ok)' }}>{filteredCompleted.length}</span>
      </div>

      {layout === 'cards' || layout === 'timeline' ? (
        <div className="q-timeline">
          {filteredCompleted.map((item, idx) => (
            <QueueTimeItem key={item.id} item={item} idx={idx} t={t} done />
          ))}
        </div>
      ) : (
        <div className="q-list">
          {filteredCompleted.map((item, idx) => (
            <DoneRow
              key={item.id}
              item={item}
              idx={idx}
              t={t}
              admin={admin}
              onDelete={deleteCompleted}
            />
          ))}
        </div>
      )}
    </section>
  );
}

Object.assign(window, { QueueSection });

  </script>

  <script type="text/babel" data-presets="react">
const { useState: pfState, useEffect: pfEffect, useRef: pfRef, useMemo: pfMemo } = React;

// ══════════════════════════════════════════════════════════
//  Portfolio — folders of artwork with media manager
// ══════════════════════════════════════════════════════════

// ── Card on the main grid ──
function PortfolioCard({ item, t, onClick, coverSrc, count, admin, onEdit, onDelete }) {
  const label = t.portfolio.categories[item.key] || item.key;
  const glyph = label.charAt(0).toUpperCase();
  return (
    <div className="pf-card" style={{ '--hue': item.hue }} onClick={onClick}>
      <div className="pf-card-img">
        {coverSrc
          ? <img src={coverSrc} alt={label} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
          : <span className="pf-card-glyph">{glyph}</span>}
      </div>
      <div className="pf-card-info">
        <h3 className="pf-card-title">{label}</h3>
        <span className="pf-card-count">{count} {count === 1 ? 'piece' : 'pieces'}</span>
      </div>
      {admin && (
        <div style={{ position: 'absolute', top: 10, right: 10, display: 'flex', gap: 5, zIndex: 3 }}>
          <button className="admin-btn" onClick={e => { e.stopPropagation(); onEdit(item); }}>✎</button>
          <button className="admin-btn danger" onClick={e => { e.stopPropagation(); onDelete(item.id); }}>×</button>
        </div>
      )}
    </div>
  );
}

// ── Fullscreen lightbox for a single image ──
function Lightbox({ src, onClose, onPrev, onNext, current, total }) {
  pfEffect(() => {
    const onKey = e => {
      if (e.key === 'Escape') onClose();
      if (e.key === 'ArrowLeft' && onPrev) onPrev();
      if (e.key === 'ArrowRight' && onNext) onNext();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  return ReactDOM.createPortal(
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, zIndex: 99999,
      background: 'rgba(0,0,0,0.92)', backdropFilter: 'blur(20px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      cursor: 'zoom-out',
    }}>
      <img src={src} onClick={e => e.stopPropagation()} style={{
        maxWidth: '92vw', maxHeight: '90vh', objectFit: 'contain',
        borderRadius: 8, cursor: 'default',
        boxShadow: '0 20px 80px rgba(0,0,0,0.6)',
      }} alt="" />

      {onPrev && <button onClick={e => { e.stopPropagation(); onPrev(); }} style={{
        position: 'absolute', left: 20, top: '50%', transform: 'translateY(-50%)',
        background: 'rgba(255,255,255,0.1)', border: 'none', color: '#fff',
        width: 48, height: 48, borderRadius: '50%', fontSize: 24, cursor: 'pointer',
      }}>‹</button>}

      {onNext && <button onClick={e => { e.stopPropagation(); onNext(); }} style={{
        position: 'absolute', right: 20, top: '50%', transform: 'translateY(-50%)',
        background: 'rgba(255,255,255,0.1)', border: 'none', color: '#fff',
        width: 48, height: 48, borderRadius: '50%', fontSize: 24, cursor: 'pointer',
      }}>›</button>}

      <button onClick={onClose} style={{
        position: 'absolute', top: 20, right: 20,
        background: 'rgba(255,255,255,0.1)', border: 'none', color: '#fff',
        width: 40, height: 40, borderRadius: '50%', fontSize: 20, cursor: 'pointer',
      }}>×</button>

      {total > 1 && <span style={{
        position: 'absolute', bottom: 24, left: '50%', transform: 'translateX(-50%)',
        fontFamily: 'var(--font-mono)', fontSize: 12, color: 'rgba(255,255,255,0.5)',
        background: 'rgba(0,0,0,0.5)', padding: '6px 16px', borderRadius: 20,
      }}>{current + 1} / {total}</span>}
    </div>,
    document.body
  );
}

// ── Category gallery (folder view — works for both public and admin) ──
function CategoryGallery({ category, images, imagesRes, t, lang, admin, onClose }) {
  const label = t.portfolio.categories[category.key] || category.key;
  const catImages = pfMemo(() =>
    images.filter(img => img.category_id === category.id)
      .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0)),
    [images, category.id]
  );
  const [lightboxIdx, setLightboxIdx] = pfState(null);
  const [uploading, setUploading] = pfState(false);
  const [urlInput, setUrlInput] = pfState('');
  const fileRef = pfRef(null);

  async function addUrl() {
    if (!urlInput.trim()) return;
    setUploading(true);
    const result = await imagesRes.add({
      category_id: category.id,
      image_data: urlInput.trim(),
      is_cover: catImages.length === 0,
      sort_order: catImages.length,
    });
    setUploading(false);
    if (result) setUrlInput('');
    else alert('Не удалось добавить картинку. Проверь URL.');
  }

  async function handleUpload(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    // Sanity check: category must be a real Supabase row (UUID)
    if (String(category.id).startsWith('def-')) {
      alert('Эта категория ещё не сохранена в базе. Дождись загрузки данных с сервера (несколько секунд) и попробуй снова.');
      if (fileRef.current) fileRef.current.value = '';
      return;
    }
    setUploading(true);
    let successCount = 0;
    for (let idx = 0; idx < files.length; idx++) {
      const file = files[idx];
      const dataUrl = await window.uploadImage(file);
      if (!dataUrl) continue;
      const result = await imagesRes.add({
        category_id: category.id,
        image_data: dataUrl,
        is_cover: catImages.length === 0 && idx === 0,
        sort_order: catImages.length + idx,
      });
      if (result) successCount++;
      else {
        alert('Не удалось загрузить файл (провайдер режет большие запросы).\n\nРешение: загрузи картинку на imgur.com или postimages.org → скопируй URL → вставь в поле URL слева.');
        break;
      }
    }
    setUploading(false);
    if (fileRef.current) fileRef.current.value = '';
  }

  function setCover(imgId) {
    catImages.forEach(img => {
      if (img.id === imgId && !img.is_cover) imagesRes.update(img.id, { is_cover: true });
      if (img.id !== imgId && img.is_cover) imagesRes.update(img.id, { is_cover: false });
    });
  }

  function deleteImage(imgId) {
    const img = catImages.find(i => i.id === imgId);
    imagesRes.remove(imgId);
    if (img?.is_cover && catImages.length > 1) {
      const next = catImages.find(i => i.id !== imgId);
      if (next) imagesRes.update(next.id, { is_cover: true });
    }
  }

  return ReactDOM.createPortal(
    <div style={{
      position: 'fixed', inset: 0, zIndex: 9990,
      background: '#0c0a08',
      overflowY: 'auto',
    }}>
      {/* ── Top bar ── */}
      <div style={{
        position: 'sticky', top: 0, zIndex: 3,
        background: 'linear-gradient(180deg, #0c0a08 60%, transparent)',
        padding: '24px 32px 40px',
      }}>
        <div style={{ maxWidth: 1100, margin: '0 auto', display: 'flex', alignItems: 'center', gap: 16 }}>
          <button onClick={onClose} style={{
            background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.1)',
            color: '#fff', width: 42, height: 42, borderRadius: '50%', fontSize: 20,
            cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
            transition: 'background .15s',
          }} onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.12)'}
             onMouseLeave={e => e.currentTarget.style.background = 'rgba(255,255,255,0.06)'}>
            ←
          </button>
          <div style={{ flex: 1 }}>
            <div style={{
              fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.1em',
              color: 'var(--accent)', textTransform: 'uppercase', marginBottom: 4,
            }}>✦ {lang === 'ru' ? 'портфолио' : 'portfolio'}</div>
            <h2 style={{
              fontFamily: 'var(--font-display)', fontStyle: 'italic',
              fontSize: 'clamp(24px, 4vw, 36px)', fontWeight: 500, margin: 0, color: '#fff',
            }}>{label}</h2>
          </div>
          <span style={{
            fontFamily: 'var(--font-mono)', fontSize: 12, color: 'rgba(255,255,255,0.4)',
            padding: '6px 14px', background: 'rgba(255,255,255,0.04)',
            border: '1px solid rgba(255,255,255,0.06)', borderRadius: 20,
          }}>
            {catImages.length} {lang === 'ru' ? 'работ' : 'pieces'}
          </span>
          {admin && (
            <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
              <input
                type="text"
                placeholder={lang === 'ru' ? 'Вставь URL картинки' : 'Paste image URL'}
                value={urlInput}
                onChange={e => setUrlInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') addUrl(); }}
                style={{
                  padding: '9px 14px', borderRadius: 22, fontSize: 12,
                  fontFamily: 'var(--font-mono)', minWidth: 220,
                  background: 'rgba(255,255,255,0.06)',
                  border: '1px solid rgba(255,255,255,0.1)', color: '#fff',
                  outline: 'none',
                }}
              />
              <button onClick={addUrl} disabled={uploading || !urlInput.trim()} style={{
                background: 'var(--accent)', border: 'none', color: '#fff',
                padding: '10px 18px', borderRadius: 22, fontSize: 12,
                fontFamily: 'var(--font-mono)', cursor: uploading ? 'wait' : 'pointer',
                letterSpacing: '0.04em', opacity: uploading ? 0.6 : 1,
              }}>
                {uploading ? '⏳' : '+ URL'}
              </button>
              <button onClick={() => fileRef.current?.click()} disabled={uploading} style={{
                background: 'rgba(255,255,255,0.06)',
                border: '1px solid rgba(255,255,255,0.1)', color: '#fff',
                padding: '10px 18px', borderRadius: 22, fontSize: 12,
                fontFamily: 'var(--font-mono)', cursor: uploading ? 'wait' : 'pointer',
                letterSpacing: '0.04em', opacity: uploading ? 0.6 : 1,
              }}>
                <input ref={fileRef} type="file" accept="image/*" multiple style={{ display: 'none' }} onChange={handleUpload} />
                {uploading ? '⏳' : '📷'} {lang === 'ru' ? 'Файл' : 'File'}
              </button>
            </div>
          )}
        </div>
      </div>

      {/* ── Image grid ── */}
      <div style={{ maxWidth: 1100, margin: '0 auto', padding: '0 32px 60px' }}>
        {catImages.length === 0 ? (
          <div style={{
            textAlign: 'center', padding: '80px 20px',
            color: 'rgba(255,255,255,0.3)', fontFamily: 'var(--font-body)', fontSize: 15,
          }}>
            {admin
              ? (lang === 'ru' ? 'Пока пусто. Нажми «Загрузить» чтобы добавить арты.' : 'Empty. Click Upload to add artwork.')
              : (lang === 'ru' ? 'Скоро здесь появятся работы.' : 'Coming soon.')}
          </div>
        ) : (
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))',
            gap: 16,
          }}>
            {catImages.map((img, i) => {
              const isCover = img.is_cover;
              return (
                <div key={img.id} style={{
                  position: 'relative', borderRadius: 14, overflow: 'hidden',
                  aspectRatio: '4/5', cursor: 'pointer',
                  border: isCover ? '2px solid var(--accent)' : '1px solid rgba(255,255,255,0.06)',
                  transition: 'transform .2s, box-shadow .2s',
                }}
                  onClick={() => setLightboxIdx(i)}
                  onMouseEnter={e => { e.currentTarget.style.transform = 'scale(1.02)'; e.currentTarget.style.boxShadow = '0 12px 40px rgba(0,0,0,0.4)'; }}
                  onMouseLeave={e => { e.currentTarget.style.transform = ''; e.currentTarget.style.boxShadow = ''; }}
                >
                  <img src={img.image_data} style={{ width: '100%', height: '100%', objectFit: 'cover' }} alt="" loading="lazy" />

                  {/* Cover badge */}
                  {isCover && (
                    <span style={{
                      position: 'absolute', top: 10, left: 10,
                      fontSize: 10, padding: '3px 10px', borderRadius: 8,
                      background: 'var(--accent)', color: '#fff',
                      fontFamily: 'var(--font-mono)', letterSpacing: '0.08em',
                      textTransform: 'uppercase', fontWeight: 600,
                    }}>обложка</span>
                  )}

                  {/* Admin overlay */}
                  {admin && (
                    <div style={{
                      position: 'absolute', inset: 0,
                      background: 'linear-gradient(transparent 50%, rgba(0,0,0,0.85))',
                      opacity: 0, transition: 'opacity .2s',
                      display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
                      padding: 14, gap: 8,
                    }}
                      onMouseEnter={e => e.currentTarget.style.opacity = 1}
                      onMouseLeave={e => e.currentTarget.style.opacity = 0}
                    >
                      <button onClick={e => { e.stopPropagation(); setCover(img.id); }} style={{
                        background: isCover ? 'var(--accent)' : 'rgba(255,255,255,0.12)',
                        border: '1px solid rgba(255,255,255,0.15)', color: '#fff',
                        padding: '7px 16px', borderRadius: 20, fontSize: 12,
                        fontFamily: 'var(--font-mono)', cursor: 'pointer',
                        display: 'flex', alignItems: 'center', gap: 5,
                      }}>★ {isCover ? 'Обложка' : 'В обложку'}</button>

                      <button onClick={e => { e.stopPropagation(); deleteImage(img.id); }} style={{
                        background: 'rgba(220,50,50,0.3)', border: '1px solid rgba(220,50,50,0.3)',
                        color: '#ff8888', padding: '7px 14px', borderRadius: 20,
                        fontSize: 12, cursor: 'pointer', fontFamily: 'var(--font-mono)',
                      }}>✕ Удалить</button>
                    </div>
                  )}
                </div>
              );
            })}

            {/* Upload placeholder tile */}
            {admin && (
              <div onClick={() => fileRef.current?.click()} style={{
                aspectRatio: '4/5', borderRadius: 14,
                border: '2px dashed rgba(255,255,255,0.08)',
                display: 'flex', flexDirection: 'column', alignItems: 'center',
                justifyContent: 'center', gap: 12, cursor: 'pointer',
                transition: 'border-color .2s, background .2s',
                color: 'rgba(255,255,255,0.25)',
              }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--accent)'; e.currentTarget.style.background = 'rgba(255,255,255,0.02)'; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(255,255,255,0.08)'; e.currentTarget.style.background = ''; }}
              >
                <span style={{ fontSize: 40, lineHeight: 1 }}>+</span>
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: 12, letterSpacing: '0.06em' }}>
                  {lang === 'ru' ? 'Загрузить' : 'Upload'}
                </span>
              </div>
            )}
          </div>
        )}
      </div>

      {/* ── Lightbox ── */}
      {lightboxIdx !== null && catImages[lightboxIdx] && (
        <Lightbox
          src={catImages[lightboxIdx].image_data}
          current={lightboxIdx}
          total={catImages.length}
          onClose={() => setLightboxIdx(null)}
          onPrev={lightboxIdx > 0 ? () => setLightboxIdx(lightboxIdx - 1) : null}
          onNext={lightboxIdx < catImages.length - 1 ? () => setLightboxIdx(lightboxIdx + 1) : null}
        />
      )}
    </div>,
    document.body
  );
}

// ── Main Section ──
function PortfolioSection({ t, admin, lang }) {
  const pfDefaults = pfMemo(() => [
    ...DEFAULT_PORTFOLIO.models.map((m, i) => ({ id: 'def-m-'+i, key: m.key, kind: 'model', count: m.count, hue: m.hue, sort_order: i })),
    ...DEFAULT_PORTFOLIO.illustrations.map((m, i) => ({ id: 'def-i-'+i, key: m.key, kind: 'illustration', count: m.count, hue: m.hue, sort_order: i + 100 })),
  ], []);
  const pfRes = useResource('portfolio_categories', pfDefaults);
  const imagesRes = useResource('portfolio_images', []);
  const allImages = Array.isArray(imagesRes.items) ? imagesRes.items : [];

  const [openCategory, setOpenCategory] = pfState(null);
  const [pfEdit, setPfEdit] = pfState(null);

  const pfFields = pfMemo(() => [
    { key: 'key', label: lang === 'ru' ? 'Название' : 'Name', type: 'text', required: true, default: '' },
    { key: 'kind', label: lang === 'ru' ? 'Вид' : 'Kind', type: 'select', default: 'model', options: [
      { value: 'model', label: lang === 'ru' ? 'Модель' : 'Model' },
      { value: 'illustration', label: lang === 'ru' ? 'Иллюстрация' : 'Illustration' },
    ]},
    { key: 'hue', label: lang === 'ru' ? 'Оттенок (0-360)' : 'Hue', type: 'number', min: 0, max: 360, default: 40 },
    { key: 'video_url', label: 'YouTube', type: 'text', default: '' },
  ], [lang]);

  function handleSavePf(draft) {
    if (pfEdit.isNew) pfRes.add({ key: draft.key, kind: draft.kind || 'model', hue: draft.hue || 40, video_url: draft.video_url || '' });
    else pfRes.update(pfEdit.item.id, draft);
  }

  const items = Array.isArray(pfRes.items) ? pfRes.items : [];
  const portfolio = pfMemo(() => ({
    models: items.filter(c => c.kind === 'model'),
    illustrations: items.filter(c => c.kind === 'illustration'),
  }), [items]);

  function getCoverSrc(catId) {
    const cover = allImages.find(img => img.category_id === catId && img.is_cover);
    if (cover) return cover.image_data;
    const first = allImages.find(img => img.category_id === catId);
    return first?.image_data || null;
  }

  function getCatCount(catId) {
    return allImages.filter(img => img.category_id === catId).length;
  }

  const renderGrid = (list) => list.map(item => (
    <PortfolioCard key={item.id} item={item} t={t}
      coverSrc={getCoverSrc(item.id)}
      count={getCatCount(item.id) || item.count || 0}
      admin={admin}
      onClick={() => setOpenCategory(item)}
      onEdit={it => setPfEdit({ item: it, isNew: false })}
      onDelete={id => pfRes.remove(id)} />
  ));

  return (
    <section id="portfolio" className="page-section stagger-children">
      <PageHead tag={t.portfolio.tag} title={t.portfolio.title} />

      <div className="section-label">
        <span className="dot"></span>
        <span>{t.portfolio.models}</span>
      </div>
      <div className="pf-grid stagger-children">{renderGrid(portfolio.models)}</div>

      <div className="section-label" style={{ marginTop: 40 }}>
        <span className="dot"></span>
        <span>{t.portfolio.illustrations}</span>
      </div>
      <div className="pf-grid stagger-children">{renderGrid(portfolio.illustrations)}</div>

      {admin && (
        <button className="add-btn" onClick={() => setPfEdit({ item: null, isNew: true })}>
          + {lang === 'ru' ? 'Добавить категорию' : 'Add category'}
        </button>
      )}

      {pfEdit && (
        <EditItemModal open={true} onClose={() => setPfEdit(null)} onSave={handleSavePf}
          fields={pfFields} values={pfEdit.item}
          title={pfEdit.isNew ? (lang === 'ru' ? 'Новая категория' : 'New') : (lang === 'ru' ? 'Редактировать' : 'Edit')}
          lang={lang} />
      )}

      {openCategory && (
        <CategoryGallery
          category={openCategory} images={allImages} imagesRes={imagesRes}
          t={t} lang={lang} admin={admin}
          onClose={() => setOpenCategory(null)} />
      )}
    </section>
  );
}

Object.assign(window, { PortfolioSection });

  </script>

  <script type="text/babel" data-presets="react">
// calculator.jsx — Калькулятор v3 (с подвкладками art/rig и PNG+)

const { useState: calcState, useEffect: calcEffect, useMemo: calcMemo } = React;

function CalcChip({ row, lang, state, onToggle, onQty }) {
  const on = state[row.id]?.on || false;
  const qty = state[row.id]?.qty || 1;
  const label = lang === 'ru' ? row.ru : row.en;
  const showQty = row.qty && on;

  return (
    <div
      className={`calc2-chip ${on ? 'on' : 'off'}`}
      onClick={(e) => {
        if (e.target.closest('.calc2-chip-qty')) return;
        onToggle(row.id);
      }}
      role="button"
      tabIndex={0}
      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onToggle(row.id); } }}
    >
      <span className="calc2-chip-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </span>
      <span className="calc2-chip-label">{label}</span>
      <span className="calc2-chip-price">
        {on
          ? (lang === 'en' ? `$${Math.round((row.rub * qty) / FX_RATE)}` : `${(row.rub * qty).toLocaleString('ru-RU')} ₽`)
          : (lang === 'en' ? `from $${Math.round(row.rub / FX_RATE)}` : `от ${row.rub.toLocaleString('ru-RU')} ₽`)
        }
      </span>
      {showQty && (
        <div className="calc2-chip-qty" onClick={(e) => e.stopPropagation()}>
          <button type="button" onClick={() => onQty(row.id, Math.max(1, qty - 1))}>−</button>
          <span>×{qty}</span>
          <button type="button" onClick={() => onQty(row.id, qty + 1)}>+</button>
        </div>
      )}
      {row._admin && (
        <div className="calc2-chip-admin" onClick={(e) => e.stopPropagation()} style={{ display:'flex', gap:3, marginLeft:4 }}>
          <button className="admin-btn" style={{width:20,height:20,fontSize:10}} onClick={() => row._onEdit(row)}>✎</button>
          <button className="admin-btn danger" style={{width:20,height:20,fontSize:10}} onClick={() => row._onDelete(row.id)}>×</button>
        </div>
      )}
    </div>
  );
}

function CalculatorSection({ t, lang, admin }) {
  // Load options from Supabase; fall back to DEFAULT_CALC structure if unavailable
  const calcRes = useResource('calc_options', [], { orderBy: 'sort_order' });
  const calcData = React.useMemo(() => {
    if (calcRes.items && calcRes.items.length > 0) {
      const tree = calcOptionsToTree(calcRes.items);
      // Make sure all 4 categories exist even if some are empty
      ['vtuber', 'chibi', 'png', 'illust'].forEach(c => {
        if (!tree[c]) tree[c] = DEFAULT_CALC[c];
      });
      return tree;
    }
    return DEFAULT_CALC;
  }, [calcRes.items]);
  const [activeTab, setActiveTab] = calcState('vtuber');
  const [activeVariant, setActiveVariant] = calcState({ vtuber: 'art', chibi: 'art', png: 'basic', illust: 'default' });
  const [contactOpen, setContactOpen] = calcState(false);
  const [calcEdit, setCalcEdit] = calcState(null);


  const [state, setState] = calcState(() => loadLS('calc:state:v2', {
    'v-a-concept': { on: true, qty: 1 },
    'v-a-hair':    { on: true, qty: 1 },
    'v-a-costume': { on: true, qty: 1 },
  }));

  calcEffect(() => saveLS('calc:state:v2', state), [state]);

  function toggle(id) {
    setState({ ...state, [id]: { ...(state[id] || { qty: 1 }), on: !state[id]?.on } });
  }
  function setQty(id, qty) {
    setState({ ...state, [id]: { ...(state[id] || { on: true }), qty } });
  }

  const cat = calcData[activeTab];
  const variantKey = activeVariant[activeTab] || Object.keys(cat.variants)[0];
  const variant = cat.variants[variantKey];

  const calcOptionFields = calcMemo(() => [
    { key: 'label_ru', label: 'Название (RU)', type: 'text', required: true, default: '' },
    { key: 'label_en', label: 'Label (EN)', type: 'text', default: '' },
    { key: 'rub', label: lang === 'ru' ? 'Цена (₽)' : 'Price (₽)', type: 'number', min: 0, default: 0 },
    { key: 'has_qty', label: lang === 'ru' ? 'Есть количество?' : 'Has quantity?', type: 'select', default: 'false', options: [
      { value: 'false', label: lang === 'ru' ? 'Нет' : 'No' },
      { value: 'true', label: lang === 'ru' ? 'Да' : 'Yes' },
    ]},
    { key: 'group_type', label: lang === 'ru' ? 'Группа' : 'Group', type: 'select', default: 'base', options: [
      { value: 'base', label: 'Base' },
      { value: 'addon', label: 'Addon' },
    ]},
    { key: 'category', label: lang === 'ru' ? 'Категория' : 'Category', type: 'select', default: activeTab, options: [
      { value: 'vtuber', label: 'VTuber' },
      { value: 'chibi', label: 'Chibi' },
      { value: 'png', label: 'PNG' },
      { value: 'illust', label: lang === 'ru' ? 'Иллюстрация' : 'Illustration' },
    ]},
    { key: 'variant', label: lang === 'ru' ? 'Вариант' : 'Variant', type: 'text', default: variantKey },
  ], [lang, activeTab, variantKey]);

  function handleSaveCalcOption(draft) {
    const payload = {
      ...draft,
      has_qty: draft.has_qty === 'true' || draft.has_qty === true,
      rub: parseInt(draft.rub) || 0,
    };
    const savedTab = activeTab;
    const savedVariant = { ...activeVariant };
    if (calcEdit.isNew) {
      // calc_options uses text id, not UUID — must generate one
      const prefix = (payload.category || 'x').charAt(0) + '-' + (payload.group_type || 'a').charAt(0);
      payload.id = prefix + '-' + Date.now().toString(36);
      calcRes.add(payload);
    } else {
      calcRes.update(calcEdit.item.id, payload);
    }
    // Restore tab position after re-render
    setTimeout(() => {
      setActiveTab(savedTab);
      setActiveVariant(savedVariant);
    }, 50);
  }

  // Current variant total
  const { total: variantTotal, lines } = calcMemo(() => {
    const all = [...variant.base, ...(variant.addon || [])];
    let total = 0;
    const lines = [];
    all.forEach((row) => {
      const s = state[row.id];
      if (s?.on) {
        const sum = row.rub * (s.qty || 1);
        total += sum;
        lines.push({ id: row.id, label: lang === 'ru' ? row.ru : row.en, qty: s.qty || 1, sum, row });
      }
    });
    return { total, lines };
  }, [variant, state, lang]);

  // Global total across ALL categories and variants
  const { globalTotal, globalLines } = calcMemo(() => {
    let gt = 0;
    const gl = [];
    Object.values(calcData).forEach(cat => {
      Object.values(cat.variants).forEach(v => {
        [...v.base, ...(v.addon || [])].forEach(row => {
          const s = state[row.id];
          if (s?.on) {
            const sum = row.rub * (s.qty || 1);
            gt += sum;
            gl.push({ id: row.id, label: lang === 'ru' ? row.ru : row.en, qty: s.qty || 1, sum });
          }
        });
      });
    });
    return { globalTotal: gt, globalLines: gl };
  }, [calcData, state, lang]);

  const total = globalTotal;

  const totalFmt = lang === 'en'
    ? `$${Math.round(total / FX_RATE).toLocaleString('en-US')}`
    : `${total.toLocaleString('ru-RU')} ₽`;

  const totalAlt = lang === 'en'
    ? `≈ ${total.toLocaleString('ru-RU')} ₽`
    : `≈ $${Math.round(total / FX_RATE).toLocaleString('en-US')}`;

  const variantEntries = Object.entries(cat.variants);
  const showSubtabs = variantEntries.length > 1;

  return (
    <section className="page anim-in">
      <PageHead
        eyebrow={`✦ ${t.calculator.title} ✦`}
        title={t.calculator.title}
        subtitle={t.calculator.subtitle}
      />

      <div className="calc2-tabs">

            title={calcEdit.isNew ? (lang === 'ru' ? 'Новая опция' : 'New option') : (lang === 'ru' ? 'Редактировать' : 'Edit')}

        <aside className="calc2-summary">

          <ul className="calc2-summary-list">
            {globalLines.length === 0 && (
              <li className="calc2-summary-empty">
                {lang === 'ru' ? 'Ничего не выбрано' : 'Nothing selected'}

            {globalLines.map((line) => (
              <li key={line.id} className="calc2-summary-line">

                {lang === 'ru' ? 'Связаться для заказа' : 'Contact to order'}
              </button>
              <div className="calc2-payment-note">
                {lang === 'ru' ? 'Оплата: ' : 'Payment: '}
                <span>Swift</span> · <span>OzonBank</span> · <span>Boosty</span><sup>*</sup> · <span>Hipolink</span><sup>*</sup>
                <em>{lang === 'ru' ? '* комиссия платформы' : '* platform fee'}</em>
              </div>

          )}

          <div className="calc2-summary-note">{t.calculator.note}</div>
        </aside>
      </div>

      <ContactModal open={contactOpen} onClose={() => setContactOpen(false)} lang={lang} />
    </section>
  );
}

// ─── Contact modal ───

  );
  if (!finalLinks.find(l => l.kind === 'mail')) {
    finalLinks.push({ id: 'email-default', label: 'Email', handle: 'milariayt@gmail.com', url: 'mailto:milariayt@gmail.com', kind: 'mail' });
  }

  function copy(text) {
    try { navigator.clipboard.writeText(text); } catch (e) {}

  return (
    <Modal open={open} onClose={onClose}>
      <div style={{ paddingRight: 40 }}>

        <p style={{ color: 'var(--text-muted)', margin: '0 0 28px', fontSize: 14, maxWidth: 540 }}>

            ? 'Напиши мне в любую из соцсетей или на почту — обсудим детали заказа.'

        <div className="contact-grid">
          {finalLinks.map((l) => (
            <a key={l.id} href={l.url} target="_blank" rel="noopener noreferrer" className="contact-card">
              <div className="contact-card-label">{l.label}</div>
              <div className="contact-card-handle">{l.handle}</div>
              <button
                className="contact-card-copy"
                onClick={(e) => { e.preventDefault(); copy(l.handle); }}
                title={lang === 'ru' ? 'скопировать' : 'copy'}

                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>

            </a>
          ))}
        </div>
      </div>

}
